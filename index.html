<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meilleurs vœux 2027 — carte en réalité augmentée</title>
  <link rel="stylesheet" href="style.css">
  <!-- A-Frame : éléments 3D / MindAR : reconnaissance de l'image -->
  <script src="libs/aframe.min.js"></script>
  <script src="libs/mindar-image-aframe.prod.js"></script>
  <script src="app.js"></script>
</head>
<body>
  <!-- La scène AR : targets.mind = la carte compilée pour MindAR -->
  <a-scene
    mindar-image="imageTargetSrc: assets/targets.mind; missTolerance: 10; uiScanning: no; uiLoading: no"
    color-space="sRGB" renderer="colorManagement: true; antialias: true"
    vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item id="modele-carte" src="assets/carte.glb"></a-asset-item>
      <img id="decoupe" src="assets/decoupe.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Tout ce qui est ici s'affiche par-dessus la carte (1 unité = largeur de la carte) -->
    <a-entity id="carte" mindar-image-target="targetIndex: 0" coloriage>
      <!-- Cache blanc : efface de la carte les éléments qui se soulèvent (effet découpage) -->
      <a-plane width="1" height="0.4884" position="0 0 0.001"
               material="shader: flat; src: #decoupe; transparent: true; depthWrite: false"></a-plane>
      <!-- Animation exportée de Blender (.glb) : le sol Blender (XY) est couché sur la carte -->
      <a-entity id="popup" rotation="90 0 0" gltf-model="#modele-carte" animation-glb></a-entity>
      <!-- Feux d'artifice en particules au-dessus du 2027 -->
      <a-entity feux-artifice="delai: 2600"></a-entity>
    </a-entity>
  </a-scene>

  <div id="aide" class="bulle">Vise la carte de vœux avec ton téléphone</div>
  <button id="figer" type="button" hidden>Figer mes couleurs</button>
  <div id="chargement" class="bulle">Chargement…</div>
</body>
</html>
